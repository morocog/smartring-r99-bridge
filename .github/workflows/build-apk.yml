name: Compilar APK SmartRing R99 Bridge

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Aceptar licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Compilar APK Debug con log detallado
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Subir APK generado como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRing-R99-Bridge-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Subir reportes de compilación si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Reports
          path: |
            app/build/reports/
            **/build/reports/
          retention-days: 7
