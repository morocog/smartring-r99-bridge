name: Compilar APK SmartRing R99 Bridge

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew || true

      - name: Generar gradlew si no existe
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK generado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SmartRing-R99-Bridge-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
