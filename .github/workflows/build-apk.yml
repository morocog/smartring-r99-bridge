name: Compilar APK SmartRing R99 Bridge

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Asegurar Keystore persistente para firmas consistentes
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            echo "Generando keystore persistente para el repositorio..."
            keytool -genkey -v -keystore keystore/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/debug.keystore
            git commit -m "chore: persistir keystore debug para firmas de APK consistentes" || true
            git push origin main || true
          fi
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Aceptar licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Compilar APK Debug
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_output.log

      - name: Subir APK generado como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRing-R99-Bridge-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar APK en repositorio para descarga directa
        if: success()
        continue-on-error: true
        run: |
          mkdir -p apk_output
          cp app/build/outputs/apk/debug/*.apk apk_output/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk_output/app-debug.apk || true
          git commit -m "build: actualizar APK v1.0.2 compilado" || true
          git push origin main || true

      - name: Resumen de error en caso de fallo
        if: failure()
        run: |
          mkdir -p apk_output
          tail -n 120 gradle_output.log > apk_output/build_error.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk_output/build_error.log || true
          git commit -m "build: reportar log de error en compilacion" || true
          git push origin main || true
